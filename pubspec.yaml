name: mbkdatasub
description: "MBKDATASUB - Fast & Reliable Telecom VTU & Utility Payments Native App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # UI, Fonts & Icons
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0

  # Networking & HTTP Engine
  http: ^1.2.2
  cached_network_image: ^3.3.1

  # State Management & Utilities
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Security & Biometrics
  local_auth: ^2.2.0

  # Device Features & Sharing
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
